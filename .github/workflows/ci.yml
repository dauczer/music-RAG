name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Test
        run: pytest -q
        env:
          GROQ_API_KEY: dummy-for-tests

      - name: Audit dependencies
        # These Chroma advisories target its network server and multi-tenant API.
        # This project uses only the in-process PersistentClient and exposes no
        # Chroma endpoint. No patched Chroma release exists yet.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
